apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nextcloud-resources
  namespace: argocd
spec:
  destination:
    namespace: nextcloud
    server: https://kubernetes.default.svc
  source:
    path: k8s/nextcloud-resources
    repoURL: https://github.com/thetkpark/cscms-services-deployment.git
    targetRevision: argocd
    directory:
      recurse: true
      exclude: "*.enc.yaml"
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nextcloud
  namespace: argocd
spec:
  destination:
    namespace: nextcloud
    server: "https://kubernetes.default.svc"
  source:
    repoURL: "https://nextcloud.github.io/helm/"
    targetRevision: 4.6.7
    chart: nextcloud/nextcloud
    helm:
      valueFiles:
        - nextcloud-values.yaml
  sources: []
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
