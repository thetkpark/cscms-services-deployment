apiVersion: apps/v1
kind: Deployment
metadata:
  name: lm-code-distribution-depl
spec:
  selector:
    matchLabels:
      app: lm-code-distribution-depl
  template:
    metadata:
      labels:
        app: lm-code-distribution-depl
    spec:
      containers:
        - name: lm-code-distribution-depl
          image: thetkpark/lm-code-distribution@sha256:42928747a03954a23003541e5899b06af7a46a4a96637ec17e49139930b0ec7c
          resources:
            limits:
              memory: "1Gi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "50m"
          envFrom:
            - secretRef:
                name: lm-code-distribution
                optional: false
          env:
            - name: NODE_ENV
              value: "production"
